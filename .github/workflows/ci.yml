name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  commit-lint:
    name: Valida mensagens de commit
    if: github.head_ref != 'develop' || github.base_ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Checar mensagem de commit
        env:
          COMMIT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./gradlew checkCommitMessageTest checkCommitMessage -PcommitRef="$COMMIT_REF"

  lint:
    name: Lint (Android Lint + ktlint)
    if: github.head_ref != 'develop' || github.base_ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Rodar lint
        run: ./gradlew lintCheck

  test-desktop:
    name: Testes Desktop (JVM)
    if: github.head_ref != 'develop' || github.base_ref != 'main'
    runs-on: ubuntu-latest
    environment: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: greenhouse
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          POSTGRES_DB: greenhouse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U greenhouse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Rodar testes
        env:
          API_URL: ${{ secrets.API_URL }}
          DATABASE_URL: jdbc:postgresql://localhost:5432/greenhouse?user=greenhouse&password=${{ secrets.TEST_DB_PASSWORD }}
          SPRING_FLYWAY_ENABLED: "true"
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MQTT_URL: ${{ secrets.MQTT_TEST }}
          MQTT_PASSWORD: ${{ secrets.MQTT_TEST_PASSWORD }}
        run: ./gradlew coverage

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-cobertura
          path: build/reports/jacoco/coverage/html
          if-no-files-found: warn

  test-mobile:
    name: Testes Mobile (Android)
    if: github.head_ref != 'develop' || github.base_ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Rodar testes Android
        run: ./gradlew :shared:testAndroidHostTest

  test-web:
    name: Testes Web (JS + Wasm)
    if: github.head_ref != 'develop' || github.base_ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar Chrome (necessário pro Karma)
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Liberar sandbox do Chrome
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Rodar testes web
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: ./gradlew testWeb

  deploy-test:
    name: Deploy Render (test)
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [commit-lint, lint, test-desktop, test-mobile, test-web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Definir variáveis da imagem
        run: |
          OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "REGISTRY_OWNER=${OWNER}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "IMAGE_URL=ghcr.io/${OWNER}/app:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Baixar relatório de cobertura (servido em /jacoco/)
        uses: actions/download-artifact@v4
        with:
          name: relatorio-cobertura
          path: build/reports/jacoco/coverage/html

      - name: Build e push da imagem no GHCR (Jib)
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :serverApp:jib \
            --no-configuration-cache \
            -Djib.to.auth.username="$GHCR_USER" \
            -Djib.to.auth.password="$GHCR_TOKEN"

      - name: Disparar deploy no Render (test)
        env:
          RENDER_DEPLOY_HOOK_TEST: ${{ secrets.RENDER_DEPLOY_HOOK_TEST }}
        run: |
          curl --fail --silent --show-error \
            -X POST -G \
            --data-urlencode "imgURL=${IMAGE_URL}" \
            "$RENDER_DEPLOY_HOOK_TEST"
