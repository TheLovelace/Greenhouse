paths:
  /status:
    get:
      tags:
        - Status
      summary: Verificar disponibilidade da API e do banco
      operationId: verificarStatus
      responses:
        '200':
          description: API e banco disponíveis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '401':
          $ref: '#/components/responses/ErroAutenticacao'
        '503':
          $ref: '#/components/responses/ServicoIndisponivel'
components:
  schemas:
    Status:
      type: object
      required:
        - status
        - database
      properties:
        status:
          type: string
          example: ok
        database:
          type: string
          example: ok
    Erro:
      type: object
      required:
        - error
      properties:
        error:
          type: string
  responses:
    ErroRequisicao:
      description: Requisição inválida ou dados não processáveis
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    RecursoNaoEncontrado:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    ErroAutenticacao:
      description: Falha de autenticação na conexão com o banco
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    ServicoIndisponivel:
      description: Banco de dados indisponível
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'