paths:
  /desconto:
    post:
      tags:
        - Desconto
      summary: Cadastrar desconto
      operationId: criarDesconto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DescontoCadastro'
      responses:
        '201':
          description: Desconto cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Desconto'
        '400':
          $ref: './status.yml#/components/responses/ErroRequisicao'
    get:
      tags:
        - Desconto
      summary: Listar descontos
      operationId: listarDescontos
      description: Retorna descontos ativos e inativos cadastrados.
      responses:
        '200':
          description: Descontos cadastrados; retorna uma lista vazia quando não há registros.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Desconto'
  /desconto/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador numérico do desconto
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags:
        - Desconto
      summary: Buscar desconto por ID
      operationId: buscarDescontoPorId
      responses:
        '200':
          description: Desconto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Desconto'
        '400':
          $ref: './status.yml#/components/responses/ErroRequisicao'
        '404':
          $ref: './status.yml#/components/responses/RecursoNaoEncontrado'
components:
  schemas:
    DescontoCadastro:
      type: object
      required:
        - titulo
        - tipo
        - valor
      properties:
        titulo:
          type: string
          minLength: 1
          maxLength: 150
        descricao:
          type: string
          nullable: true
        tipo:
          type: string
          enum:
            - PERCENTUAL
            - VALOR_FIXO
        valor:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: NUMERIC(12,2); para PERCENTUAL deve ser menor ou igual a 100.
        dataInicio:
          type: string
          format: date-time
          nullable: true
        dataFim:
          type: string
          format: date-time
          nullable: true
          description: Não pode ser anterior a dataInicio quando ambas forem informadas.
        ativo:
          type: boolean
          default: true
    Desconto:
      type: object
      required:
        - id
        - titulo
        - tipo
        - valor
        - ativo
      properties:
        id:
          type: integer
          format: int64
        titulo:
          type: string
          maxLength: 150
        descricao:
          type: string
          nullable: true
        tipo:
          type: string
          enum:
            - PERCENTUAL
            - VALOR_FIXO
        valor:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: Para PERCENTUAL, deve ser menor ou igual a 100; para VALOR_FIXO, deve ser maior que zero.
        dataInicio:
          type: string
          format: date-time
          nullable: true
        dataFim:
          type: string
          format: date-time
          nullable: true
        ativo:
          type: boolean
