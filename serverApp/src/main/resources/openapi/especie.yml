openapi: 3.0.3

paths:
  /especies:
    get:
      tags:
        - Espécie
      summary: Listar espécies
      description: Lista todas as espécies cadastradas. Permite filtrar pelo nome popular.
      parameters:
        - name: nome
          in: query
          required: false
          description: Filtro parcial pelo nome popular da espécie.
          schema:
            type: string
      responses:
        '200':
          description: Lista de espécies retornada com sucesso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EspecieResponse'
        '401':
          description: Não autorizado.

    post:
      tags:
        - Espécie
      summary: Cadastrar espécie
      description: Cadastra uma nova espécie. A espécie nasce ativa.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EspecieRequest'
      responses:
        '201':
          description: Espécie cadastrada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EspecieResponse'
        '400':
          description: Dados enviados inválidos.
        '401':
          description: Não autorizado.

  /especies/{id}:
    parameters:
      - $ref: '#/components/parameters/EspecieId'

    get:
      tags:
        - Espécie
      summary: Consultar espécie por ID
      responses:
        '200':
          description: Espécie encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EspecieResponse'
        '400':
          description: ID inválido.
        '404':
          description: Espécie não encontrada.
        '401':
          description: Não autorizado.

    put:
      tags:
        - Espécie
      summary: Atualizar espécie
      description: Atualiza todos os dados de uma espécie existente (o corpo é completo).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EspecieRequest'
      responses:
        '200':
          description: Espécie atualizada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EspecieResponse'
        '400':
          description: Dados enviados inválidos.
        '404':
          description: Espécie não encontrada.
        '401':
          description: Não autorizado.

    delete:
      tags:
        - Espécie
      summary: Remover espécie
      description: Remove uma espécie pelo ID. Espécie com regras de alerta ou produtos vinculados não pode ser removida; inative-a.
      responses:
        '204':
          description: Espécie removida com sucesso.
        '400':
          description: ID inválido.
        '404':
          description: Espécie não encontrada.
        '409':
          description: Espécie vinculada a alertas ou produtos.
        '401':
          description: Não autorizado.

  /especies/{id}/status:
    parameters:
      - $ref: '#/components/parameters/EspecieId'

    patch:
      tags:
        - Espécie
      summary: Alternar status da espécie
      description: Alterna o status da espécie entre ativa e inativa.
      responses:
        '200':
          description: Status alterado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EspecieResponse'
        '400':
          description: ID inválido.
        '404':
          description: Espécie não encontrada.
        '401':
          description: Não autorizado.

components:
  parameters:
    EspecieId:
      name: id
      in: path
      required: true
      description: Identificador da espécie.
      schema:
        type: integer
        format: int64
        example: 1

  schemas:
    EspecieRequest:
      type: object
      required:
        - nomePopular
        - nomeCientifico
        - intervaloRegaDias
        - temperaturaMin
        - temperaturaMax
      properties:
        nomePopular:
          type: string
          maxLength: 150
          example: Rosa

        nomeCientifico:
          type: string
          maxLength: 150
          example: Rosa gallica

        descricao:
          type: string
          nullable: true
          maxLength: 2000
          example: Planta ornamental.

        intervaloRegaDias:
          type: integer
          format: int32
          minimum: 1
          example: 3

        temperaturaMin:
          type: number
          example: 15.0
          description: Deve ser menor ou igual à temperatura máxima.

        temperaturaMax:
          type: number
          example: 28.0

        umidadeArMin:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
          example: 40.0

        umidadeArMax:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
          example: 70.0

        umidadeSoloMin:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
          example: 30.0

        umidadeSoloMax:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
          example: 60.0

    EspecieResponse:
      type: object
      required:
        - id
        - nomePopular
        - ativo
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          example: 1

        nomePopular:
          type: string
          example: Rosa

        nomeCientifico:
          type: string
          nullable: true
          example: Rosa gallica

        descricao:
          type: string
          nullable: true
          example: Planta ornamental.

        intervaloRegaDias:
          type: integer
          format: int32
          nullable: true
          example: 3

        ativo:
          type: boolean
          example: true

        temperaturaMin:
          type: number
          nullable: true
          example: 15.00

        temperaturaMax:
          type: number
          nullable: true
          example: 28.00

        umidadeArMin:
          type: number
          nullable: true
          example: 40.00

        umidadeArMax:
          type: number
          nullable: true
          example: 70.00

        umidadeSoloMin:
          type: number
          nullable: true
          example: 30.00

        umidadeSoloMax:
          type: number
          nullable: true
          example: 60.00