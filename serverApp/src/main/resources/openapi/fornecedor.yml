paths:
  /fornecedor:
    post:
      tags:
        - Fornecedor
      summary: Criar fornecedor
      operationId: criarFornecedor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Fornecedor'
      responses:
        '201':
          description: Fornecedor criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fornecedor'
        '400':
          $ref: './status.yml#/components/responses/ErroRequisicao'

    get:
      tags:
        - Fornecedor
      summary: Listar fornecedores
      operationId: listarFornecedores
      responses:
        '200':
          description: Fornecedores cadastrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Fornecedor'

  /fornecedor/{id}:
    get:
      tags:
        - Fornecedor
      summary: Buscar fornecedor por ID
      operationId: buscarFornecedorPorId
      parameters:
        - $ref: '#/components/parameters/FornecedorId'
      responses:
        '200':
          description: Fornecedor encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fornecedor'
        '400':
          $ref: './status.yml#/components/responses/ErroRequisicao'
        '404':
          $ref: './status.yml#/components/responses/RecursoNaoEncontrado'

    patch:
      tags:
        - Fornecedor
      summary: Atualizar fornecedor/Ativar e desativar
      description: Envie um ou mais campos editáveis. Campos omitidos mantêm o valor atual. Campos opcionais podem receber null.
      operationId: atualizarFornecedor
      parameters:
        - $ref: '#/components/parameters/FornecedorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FornecedorPatch'
      responses:
        '200':
          description: Fornecedor atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fornecedor'
        '400':
          $ref: './status.yml#/components/responses/ErroRequisicao'
        '404':
          $ref: './status.yml#/components/responses/RecursoNaoEncontrado'

    delete:
      tags:
        - Fornecedor
      summary: Excluir fornecedor
      operationId: excluirFornecedor
      parameters:
        - $ref: '#/components/parameters/FornecedorId'
      responses:
        '204':
          description: Fornecedor excluído
        '400':
          $ref: './status.yml#/components/responses/ErroRequisicao'
        '404':
          $ref: './status.yml#/components/responses/RecursoNaoEncontrado'

components:
  parameters:
    FornecedorId:
      name: id
      in: path
      required: true
      description: Identificador numérico do fornecedor
      schema:
        type: integer
        format: int64
        minimum: 1

  schemas:
    Fornecedor:
      type: object
      required:
        - nome
      properties:
        id:
          type: integer
          format: int64
          nullable: true
          description: Gerado pelo banco, não é necessário enviar na criação.

        nome:
          type: string
          maxLength: 150
          example: Flores Primavera

        cnpj:
          type: string
          nullable: true
          maxLength: 14
          pattern: '^[0-9]{14}$'
          description: CNPJ do fornecedor contendo exatamente 14 dígitos.
          example: '12345678000190'

        telefone:
          type: string
          nullable: true
          maxLength: 20
          example: '11999999999'

        email:
          type: string
          nullable: true
          maxLength: 150
          example: contato@floresprimavera.com

        contato:
          type: string
          nullable: true
          maxLength: 150
          example: Maria Silva

        ativo:
          type: boolean
          default: true

    FornecedorPatch:
      type: object
      description: Aceita qualquer combinação de campos editáveis; id é opcional e ignorado na atualização.
      additionalProperties: false
      anyOf:
        - required: [nome]
        - required: [cnpj]
        - required: [telefone]
        - required: [email]
        - required: [contato]
        - required: [ativo]
      properties:
        id:
          type: integer
          format: int64
          nullable: true

        nome:
          type: string
          maxLength: 150

        cnpj:
          type: string
          nullable: true
          maxLength: 14
          pattern: '^[0-9]{14}$'

        telefone:
          type: string
          nullable: true
          maxLength: 20

        email:
          type: string
          nullable: true
          maxLength: 150

        contato:
          type: string
          nullable: true
          maxLength: 150

        ativo:
          type: boolean