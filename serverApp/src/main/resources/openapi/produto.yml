paths:
  /produto:
    post:
      tags:
        - Produto
      summary: Criar produto
      operationId: criarProduto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Produto'
      responses:
        '201':
          description: Produto criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Produto'
        '400':
          $ref: './status.yml#/components/responses/ErroRequisicao'
    get:
      tags:
        - Produto
      summary: Listar produtos
      operationId: listarProdutos
      responses:
        '200':
          description: Produtos cadastrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Produto'
  /produto/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador numérico do produto
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags:
        - Produto
      summary: Buscar produto por ID
      operationId: buscarProdutoPorId
      responses:
        '200':
          description: Produto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Produto'
        '400':
          $ref: './status.yml#/components/responses/ErroRequisicao'
        '404':
          $ref: './status.yml#/components/responses/RecursoNaoEncontrado'
    patch:
      tags:
        - Produto
      summary: Atualizar produto
      description: Envie um ou mais campos editáveis. Campos omitidos mantêm o valor atual. Também aceita o objeto completo do produto.
      operationId: atualizarProduto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProdutoPatch'
      responses:
        '200':
          description: Produto atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Produto'
        '400':
          $ref: './status.yml#/components/responses/ErroRequisicao'
        '404':
          $ref: './status.yml#/components/responses/RecursoNaoEncontrado'
    delete:
      tags:
        - Produto
      summary: Excluir produto
      operationId: excluirProduto
      responses:
        '204':
          description: Produto excluído
        '400':
          $ref: './status.yml#/components/responses/ErroRequisicao'
        '404':
          $ref: './status.yml#/components/responses/RecursoNaoEncontrado'
components:
  schemas:
    Produto:
      type: object
      required:
        - nome
        - preco
      properties:
        id:
          type: integer
          format: int64
          nullable: true
          description: Identificador numérico do produto
        codigo:
          type: string
          maxLength: 50
          nullable: true
        nome:
          type: string
          maxLength: 150
        descricao:
          type: string
          nullable: true
        preco:
          type: number
          format: decimal
          minimum: 0
        ativo:
          type: boolean
          default: true
    ProdutoPatch:
      type: object
      description: Aceita qualquer combinação de campos editáveis.
      additionalProperties: false
      anyOf:
        - required: [codigo]
        - required: [nome]
        - required: [descricao]
        - required: [preco]
        - required: [ativo]
      properties:
        id:
          type: integer
          format: int64
          nullable: true
        codigo:
          type: string
          maxLength: 50
          nullable: true
        nome:
          type: string
          maxLength: 150
        descricao:
          type: string
          nullable: true
        preco:
          type: number
          format: decimal
          minimum: 0
        ativo:
          type: boolean
