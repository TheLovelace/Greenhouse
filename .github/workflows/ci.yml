name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  commit-lint:
    name: Valida mensagens de commit
    if: github.head_ref != 'develop' || github.base_ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Checar mensagem de commit
        run: ./gradlew checkCommitMessage

  lint:
    name: Lint (Android Lint + ktlint)
    if: github.head_ref != 'develop' || github.base_ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Rodar lint
        run: ./gradlew lintCheck

  test-desktop:
    name: Testes Desktop (JVM)
    if: github.head_ref != 'develop' || github.base_ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Rodar testes
        run: ./gradlew testDesktop

  test-mobile:
    name: Testes Mobile (Android)
    if: github.head_ref != 'develop' || github.base_ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Rodar testes Android
        run: ./gradlew :shared:testAndroidHostTest

  test-web:
    name: Testes Web (JS + Wasm)
    if: github.head_ref != 'develop' || github.base_ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar Chrome (necessário pro Karma)
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Liberar sandbox do Chrome
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Rodar testes web
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: ./gradlew testWeb

  deploy-test:
    name: Deploy Render (test)
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [commit-lint, lint, test-desktop, test-mobile, test-web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Definir variáveis da imagem
        run: |
          OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "REGISTRY_OWNER=${OWNER}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "IMAGE_URL=ghcr.io/${OWNER}/app:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Build e push da imagem no GHCR (Jib)
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :serverApp:jib \
            --no-configuration-cache \
            -Djib.to.auth.username="$GHCR_USER" \
            -Djib.to.auth.password="$GHCR_TOKEN"

      - name: Disparar deploy no Render (test)
        env:
          RENDER_DEPLOY_HOOK_TEST: ${{ secrets.RENDER_DEPLOY_HOOK_TEST }}
        run: |
          curl --fail --silent --show-error \
            -X POST -G \
            --data-urlencode "imgURL=${IMAGE_URL}" \
            "$RENDER_DEPLOY_HOOK_TEST"
