paths:
  /produto:
    post:
      tags:
        - Produto
      summary: Criar produto
      operationId: criarProduto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProdutoCreateRequest'
      responses:
        '201':
          description: Produto criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProdutoResponse'
        '400':
          $ref: './status.yml#/components/responses/ErroRequisicao'
        '422':
          description: Código de produto já utilizado ou valores inválidos
    get:
      tags:
        - Produto
      summary: Listar produtos
      operationId: listarProdutos
      parameters:
        - name: nome
          in: query
          required: false
          description: Filtro parcial e case-insensitive pelo nome
          schema:
            type: string
      responses:
        '200':
          description: Produtos cadastrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProdutoResponse'
  /produto/{id}:
    get:
      tags:
        - Produto
      summary: Buscar produto por ID
      operationId: buscarProdutoPorId
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador numérico do produto
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Produto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProdutoResponse'
        '400':
          $ref: './status.yml#/components/responses/ErroRequisicao'
        '404':
          $ref: './status.yml#/components/responses/RecursoNaoEncontrado'
    put:
      tags:
        - Produto
      summary: Atualizar produto
      description: Envie um ou mais campos editáveis. Campos omitidos mantêm o valor atual, codigo, descricao e prazoPreparoMinutos enviados como null têm seus valores limpos.
      operationId: atualizarProduto
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador numérico do produto
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProdutoUpdateRequest'
      responses:
        '200':
          description: Produto atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProdutoResponse'
        '400':
          $ref: './status.yml#/components/responses/ErroRequisicao'
        '404':
          $ref: './status.yml#/components/responses/RecursoNaoEncontrado'
        '422':
          description: Código de produto já utilizado ou valores inválidos
    delete:
      tags:
        - Produto
      summary: Excluir produto
      operationId: excluirProduto
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador numérico do produto
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Produto excluído
        '400':
          $ref: './status.yml#/components/responses/ErroRequisicao'
        '404':
          $ref: './status.yml#/components/responses/RecursoNaoEncontrado'
        '422':
          description: Produto possui registros vinculados em pedidos, compras ou estoque
components:
  schemas:
    ProdutoCreateRequest:
      type: object
      required:
        - nome
        - preco
      properties:
        codigo:
          type: string
          maxLength: 50
          nullable: true
        nome:
          type: string
          maxLength: 150
        descricao:
          type: string
          maxLength: 1000
          nullable: true
        preco:
          type: number
          format: decimal
          minimum: 0
          maximum: 9999999999.99
          multipleOf: 0.01
        ativo:
          type: boolean
          default: true
        prazoPreparoMinutos:
          type: integer
          format: int32
          minimum: 0
          nullable: true
    ProdutoUpdateRequest:
      type: object
      additionalProperties: false
      description: Campos omitidos mantêm os valores atuais, prazoPreparoMinutos pode ser enviado como null para limpar o valor.
      anyOf:
        - required: [codigo]
        - required: [nome]
        - required: [descricao]
        - required: [preco]
        - required: [ativo]
        - required: [prazoPreparoMinutos]
      properties:
        id:
          type: integer
          format: int64
          nullable: true
          description: Compatibilidade com clientes existentes; o identificador da rota prevalece.
        codigo:
          type: string
          maxLength: 50
          nullable: true
        nome:
          type: string
          maxLength: 150
        descricao:
          type: string
          maxLength: 1000
          nullable: true
        preco:
          type: number
          format: decimal
          minimum: 0
          maximum: 9999999999.99
          multipleOf: 0.01
        ativo:
          type: boolean
        prazoPreparoMinutos:
          type: integer
          format: int32
          minimum: 0
          nullable: true
    ProdutoResponse:
      type: object
      required:
        - id
        - codigo
        - nome
        - descricao
        - preco
        - ativo
        - prazoPreparoMinutos
      properties:
        id:
          type: integer
          format: int64
        codigo:
          type: string
          maxLength: 50
          nullable: true
        nome:
          type: string
          maxLength: 150
        descricao:
          type: string
          nullable: true
        preco:
          type: number
          format: decimal
          minimum: 0
        ativo:
          type: boolean
        prazoPreparoMinutos:
          type: integer
          format: int32
          minimum: 0
          nullable: true
