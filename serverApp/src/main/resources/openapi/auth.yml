paths:
  /auth/login:
    post:
      tags:
        - Acesso
      summary: Login de funcionário ou administrador
      description: Valida a credencial e retorna um JWT. Contas pendentes de primeiro acesso não podem autenticar. Credenciais legadas são convertidas para BCrypt após autenticação bem-sucedida quando compatíveis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Credenciais inválidas ou usuário inativo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppExceptionError'

  /auth/primeiro-acesso:
    post:
      tags:
        - Acesso
      summary: Definir senha no primeiro acesso
      description: Valida CPF e e-mail do funcionário, armazena a senha com BCrypt e conclui o primeiro acesso. A senha deve ter no mínimo 6 caracteres e no máximo 72 bytes em UTF-8; senhas maiores são rejeitadas sem truncamento.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrimeiroAcessoRequest'
      responses:
        '204':
          description: Senha redefinida com sucesso (sem corpo de resposta)
        '400':
          description: Dados de validação incorretos ou erro de formatação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppExceptionError'
        '404':
          description: Funcionário não encontrado

components:
  schemas:
    LoginRequest:
      type: object
      required:
        - login
        - senhaHash
      properties:
        login:
          type: string
          example: "luna.leao"
        senhaHash:
          type: string
          description: Senha em texto fornecida para autenticação; o backend compara credenciais legadas e migra para BCrypt após login válido.
          example: "minha-nova-senha-123"

    PrimeiroAcessoRequest:
      type: object
      required:
        - cpf
        - email
        - novaSenha
      properties:
        cpf:
          type: string
          example: "12345678901"
        email:
          type: string
          example: "luna@greenhouse.com"
        novaSenha:
          type: string
          minLength: 6
          description: Senha em texto. Máximo de 72 bytes em UTF-8 para compatibilidade com BCrypt.
          example: "minha-nova-senha-123"

    TokenResponse:
      type: object
      properties:
        token:
          type: string
          example: "jwt-token-simulado-para-luna.leao-perfil-FUNCIONARIO"
        perfil:
          type: string
          example: "FUNCIONARIO"

    AppExceptionError:
      type: object
      properties:
        message:
          type: string
          example: "Falha de autenticação"
        status:
          type: string
          example: "UNAUTHORIZED"