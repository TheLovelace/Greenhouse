paths:
  /categoria:
    post:
      tags:
        - Categoria
      summary: Criar categoria
      operationId: criarCategoria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Categoria'
      responses:
        '201':
          description: Categoria criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categoria'
        '400':
          $ref: './status.yml#/components/responses/ErroRequisicao'
    get:
      tags:
        - Categoria
      summary: Listar categorias
      operationId: listarCategorias
      responses:
        '200':
          description: Categorias cadastradas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Categoria'
  /categoria/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador numérico da categoria
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags:
        - Categoria
      summary: Buscar categoria por ID
      operationId: buscarCategoriaPorId
      responses:
        '200':
          description: Categoria encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categoria'
        '400':
          $ref: './status.yml#/components/responses/ErroRequisicao'
        '404':
          $ref: './status.yml#/components/responses/RecursoNaoEncontrado'
    patch:
      tags:
        - Categoria
      summary: Atualizar categoria
      description: Envie um ou mais campos editáveis. Campos omitidos mantêm o valor atual. Também aceita o objeto completo da categoria.
      operationId: atualizarCategoria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaPatch'
      responses:
        '200':
          description: Categoria atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Categoria'
        '400':
          $ref: './status.yml#/components/responses/ErroRequisicao'
        '404':
          $ref: './status.yml#/components/responses/RecursoNaoEncontrado'
    delete:
      tags:
        - Categoria
      summary: Excluir categoria
      operationId: excluirCategoria
      responses:
        '204':
          description: Categoria excluida
        '400':
          $ref: './status.yml#/components/responses/ErroRequisicao'
        '404':
          $ref: './status.yml#/components/responses/RecursoNaoEncontrado'
components:
  schemas:
    Categoria:
      type: object
      required:
        - nome
        - descricao
      properties:
        id:
          type: integer
          format: int64
          nullable: true
          description: Gerado pelo banco, não é necessário enviar na criação.
        nome:
          type: string
          maxLength: 100
        descricao:
          type: string
        ativo:
          type: boolean
          default: true
    CategoriaPatch:
      type: object
      description: Aceita qualquer combinação de campos editáveis; id é opcional e ignorado na atualização.
      additionalProperties: false
      anyOf:
        - required: [nome]
        - required: [descricao]
        - required: [ativo]
      properties:
        id:
          type: integer
          format: int64
          nullable: true
        nome:
          type: string
          maxLength: 100
        descricao:
          type: string
        ativo:
          type: boolean