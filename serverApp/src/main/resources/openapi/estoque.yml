paths:
  /estoque:
    post:
      tags:
        - Estoque
      summary: Cadastrar posição de estoque para um produto
      description: Cria a posição somente se o produto ainda não possuir uma. A quantidade reservada inicia em zero e é controlada pelo fluxo de pedidos.
      operationId: criarPosicaoEstoque
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstoqueCreate'
      responses:
        '201':
          description: Posição de estoque criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstoquePosicao'
        '400':
          $ref: './status.yml#/components/responses/ErroRequisicao'
        '404':
          $ref: './status.yml#/components/responses/RecursoNaoEncontrado'
        '409':
          description: O produto já possui uma posição de estoque
          content:
            application/json:
              schema:
                $ref: './status.yml#/components/schemas/Erro'
  /estoque/{produtoId}:
    get:
      tags:
        - Estoque
      summary: Consultar posição de estoque por produto
      description: Retorna os saldos e os dados de controle do estoque. Produtos existentes sem posição cadastrada retornam quantidades zeradas, localização nula e estoque desbloqueado.
      operationId: consultarEstoquePorProduto
      parameters:
        - name: produtoId
          in: path
          required: true
          description: Identificador numérico do produto
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Posição de estoque do produto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstoquePosicao'
        '400':
          $ref: './status.yml#/components/responses/ErroRequisicao'
        '404':
          $ref: './status.yml#/components/responses/RecursoNaoEncontrado'
    patch:
      tags:
        - Estoque
      summary: Atualizar posição de estoque
      description: Atualiza parcialmente os campos quantidadeFisica, quantidadeMinima, localizacao e bloqueado. A quantidade reservada é controlada exclusivamente pelo fluxo de pedidos. A quantidade física não pode ficar abaixo da quantidade reservada.
      operationId: atualizarPosicaoEstoque
      parameters:
        - name: produtoId
          in: path
          required: true
          description: Identificador numérico do produto
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstoquePatch'
      responses:
        '200':
          description: Posição de estoque atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstoquePosicao'
        '400':
          $ref: './status.yml#/components/responses/ErroRequisicao'
        '404':
          $ref: './status.yml#/components/responses/RecursoNaoEncontrado'
components:
  schemas:
    EstoqueCreate:
      type: object
      additionalProperties: false
      required:
        - produtoId
      properties:
        produtoId:
          type: integer
          format: int64
          minimum: 1
        quantidadeFisica:
          type: integer
          format: int32
          minimum: 0
          default: 0
        quantidadeMinima:
          type: integer
          format: int32
          minimum: 0
          default: 0
        localizacao:
          type: string
          nullable: true
          maxLength: 100
        bloqueado:
          type: boolean
          default: false
    EstoquePatch:
      type: object
      additionalProperties: false
      anyOf:
        - required: [quantidadeFisica]
        - required: [quantidadeMinima]
        - required: [localizacao]
        - required: [bloqueado]
      properties:
        quantidadeFisica:
          type: integer
          format: int32
          minimum: 0
        quantidadeMinima:
          type: integer
          format: int32
          minimum: 0
        localizacao:
          type: string
          nullable: true
          maxLength: 100
        bloqueado:
          type: boolean
    EstoquePosicao:
      type: object
      required:
        - produtoId
        - quantidadeFisica
        - quantidadeReservada
        - quantidadeDisponivel
        - quantidadeMinima
        - localizacao
        - bloqueado
      properties:
        produtoId:
          type: integer
          format: int64
        quantidadeFisica:
          type: integer
          format: int32
          minimum: 0
        quantidadeReservada:
          type: integer
          format: int32
          minimum: 0
          description: Controlada exclusivamente pelo fluxo de pedidos.
        quantidadeDisponivel:
          type: integer
          format: int32
          minimum: 0
          description: Quantidade física menos quantidade reservada.
        quantidadeMinima:
          type: integer
          format: int32
          minimum: 0
        localizacao:
          type: string
          nullable: true
          maxLength: 100
        bloqueado:
          type: boolean
          description: Produtos bloqueados não podem ser reservados ou vendidos em pedidos imediatos.
