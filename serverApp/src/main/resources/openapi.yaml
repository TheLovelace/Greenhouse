openapi: 3.0.3
info:
  title: Greenhouse API
  version: 1.0.0
  description: API do backend Greenhouse.
servers:
  - url: /api
    description: Prefixo padrão da API
tags:
  - name: Categoria
    description: Operações de cadastro e consulta de categorias
  - name: Cliente
    description: Operações de cadastro, consulta e gerenciamento de status de clientes
  - name: Desconto
    description: Cadastro e consulta de descontos
  - name: Fornecedor
    description: Operações de cadastro e consulta de fornecedores
  - name: Forma de Pagamento
    description: Cadastro, consulta e gerenciamento de formas de pagamento
  - name: Estoque
    description: Operações de movimentação e consulta de estoque
  - name: Produto
    description: Operações de cadastro e consulta de produtos
  - name: Funcionário
    description: Cadastro, consulta e gerenciamento de funcionários
  - name: Status
    description: Verificação da disponibilidade da API e do banco de dados
paths:
  /categoria:
    $ref: './openapi/categoria.yml#/paths/~1categoria'
  /categoria/{id}:
    $ref: './openapi/categoria.yml#/paths/~1categoria~1%7Bid%7D'
  /cliente:
    $ref: './openapi/cliente.yml#/paths/~1cliente'
  /cliente/{id}:
    $ref: './openapi/cliente.yml#/paths/~1cliente~1%7Bid%7D'
  /desconto:
    $ref: './openapi/desconto.yml#/paths/~1desconto'
  /desconto/{id}:
    $ref: './openapi/desconto.yml#/paths/~1desconto~1%7Bid%7D'
  /estoque:
    $ref: './openapi/estoque.yml#/paths/~1estoque'
  /estoque/{produtoId}:
    $ref: './openapi/estoque.yml#/paths/~1estoque~1%7BprodutoId%7D'
  /fornecedor:
    $ref: './openapi/fornecedor.yml#/paths/~1fornecedor'
  /fornecedor/{id}:
    $ref: './openapi/fornecedor.yml#/paths/~1fornecedor~1%7Bid%7D'
  /forma-pagamento:
    $ref: './openapi/forma-pagamento.yml#/paths/~1forma-pagamento'
  /forma-pagamento/{id}:
    $ref: './openapi/forma-pagamento.yml#/paths/~1forma-pagamento~1%7Bid%7D'
  /produto:
    $ref: './openapi/produto.yml#/paths/~1produto'
  /produto/{id}:
    $ref: './openapi/produto.yml#/paths/~1produto~1%7Bid%7D'
  /status:
    $ref: './openapi/status.yml#/paths/~1status'
  /funcionario:
    $ref: './openapi/funcionario.yml#/paths/~1'
  /funcionario/{id}:
    $ref: './openapi/funcionario.yml#/paths/~1%7Bid%7D'
  /auth/signin:
    $ref: 'openapi/auth.yml#/paths/~1auth~1signin'
  /auth/signup:
    $ref: 'openapi/auth.yml#/paths/~1auth~1signup'
components:
  schemas:
    Categoria:
      $ref: './openapi/categoria.yml#/components/schemas/Categoria'
    Cliente:
      $ref: './openapi/cliente.yml#/components/schemas/Cliente'
    Desconto:
      $ref: './openapi/desconto.yml#/components/schemas/Desconto'
    Fornecedor:
      $ref: './openapi/fornecedor.yml#/components/schemas/Fornecedor'
    FormaPagamento:
      $ref: './openapi/forma-pagamento.yml#/components/schemas/FormaPagamento'
    EstoqueCreate:
      $ref: './openapi/estoque.yml#/components/schemas/EstoqueCreate'
    Estoque:
      $ref: './openapi/estoque.yml#/components/schemas/Estoque'
    Funcionario:
      $ref: './openapi/funcionario.yml#/components/schemas/Funcionario'
    FuncionarioCreate:
      $ref: './openapi/funcionario.yml#/components/schemas/FuncionarioCreate'
    Produto:
      $ref: './openapi/produto.yml#/components/schemas/Produto'
    Status:
      $ref: './openapi/status.yml#/components/schemas/Status'
    Erro:
      $ref: './openapi/status.yml#/components/schemas/Erro'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT