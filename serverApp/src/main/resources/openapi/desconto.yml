paths:
  /desconto:
    post:
      tags:
        - Desconto
      summary: Cadastrar desconto
      operationId: criarDesconto
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DescontoCadastro'
      responses:
        '201':
          description: Desconto cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Desconto'
        '400':
          $ref: './status.yml#/components/responses/ErroRequisicao'
    get:
      tags:
        - Desconto
      summary: Listar descontos
      operationId: listarDescontos
      description: Retorna descontos ativos e inativos cadastrados.
      responses:
        '200':
          description: Descontos cadastrados; retorna uma lista vazia quando não há registros.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Desconto'
  /desconto/{id}:
    get:
      tags:
        - Desconto
      summary: Buscar desconto por ID
      operationId: buscarDescontoPorId
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador numérico do desconto
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Desconto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Desconto'
        '400':
          $ref: './status.yml#/components/responses/ErroRequisicao'
        '404':
          $ref: './status.yml#/components/responses/RecursoNaoEncontrado'
    put:
      tags:
        - Desconto
      summary: Atualizar desconto (registro completo)
      description: Substitui os dados editáveis do desconto. Envie todos os campos, inclusive descricao, dataInicio, dataFim, ativo e quantidadeMinimaItens. descricao, dataInicio e dataFim podem ser null. O ID é definido pelo caminho.
      operationId: substituirDesconto
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador numérico do desconto
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DescontoAtualizacao'
      responses:
        '200':
          description: Desconto substituído
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Desconto'
        '400':
          $ref: './status.yml#/components/responses/ErroRequisicao'
        '404':
          $ref: './status.yml#/components/responses/RecursoNaoEncontrado'
    patch:
      tags:
        - Desconto
      summary: Atualizar desconto (campos parciais)
      description: Atualiza os dados do desconto, incluindo o status ativo. Campos omitidos mantêm os valores atuais; descricao, dataInicio e dataFim podem ser enviados como null. O campo id, se enviado, é ignorado.
      operationId: atualizarDesconto
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador numérico do desconto
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DescontoPatch'
      responses:
        '200':
          description: Desconto atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Desconto'
        '400':
          $ref: './status.yml#/components/responses/ErroRequisicao'
        '404':
          $ref: './status.yml#/components/responses/RecursoNaoEncontrado'
    delete:
      tags:
        - Desconto
      summary: Inativar desconto
      description: Inativa o desconto sem apagar o registro nem seus vínculos históricos.
      operationId: excluirDesconto
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador numérico do desconto
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Desconto inativado
        '400':
          $ref: './status.yml#/components/responses/ErroRequisicao'
        '404':
          $ref: './status.yml#/components/responses/RecursoNaoEncontrado'
components:
  schemas:
    DescontoAtualizacao:
      type: object
      description: Representação completa dos campos editáveis. Campos opcionais devem ser enviados explicitamente; valores nulos limpam descricao e datas.
      additionalProperties: false
      required:
        - titulo
        - descricao
        - tipo
        - valor
        - dataInicio
        - dataFim
        - ativo
        - quantidadeMinimaItens
      properties:
        titulo:
          type: string
          minLength: 1
          maxLength: 150
        descricao:
          type: string
          nullable: true
          maxLength: 1000
        tipo:
          type: string
          enum:
            - PERCENTUAL
            - VALOR_FIXO
        valor:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: NUMERIC(12,2); para PERCENTUAL deve ser menor ou igual a 100.
        dataInicio:
          type: string
          format: date-time
          nullable: true
        dataFim:
          type: string
          format: date-time
          nullable: true
        ativo:
          type: boolean
        quantidadeMinimaItens:
          type: integer
          format: int32
          minimum: 1
    DescontoPatch:
      type: object
      description: Aceita qualquer combinação de campos editáveis; campos omitidos mantêm o valor atual.
      additionalProperties: false
      anyOf:
        - required: [titulo]
        - required: [descricao]
        - required: [tipo]
        - required: [valor]
        - required: [dataInicio]
        - required: [dataFim]
        - required: [ativo]
        - required: [quantidadeMinimaItens]
      properties:
        id:
          type: integer
          format: int64
          nullable: true
          description: Ignorado na atualização.
        titulo:
          type: string
          minLength: 1
          maxLength: 150
        descricao:
          type: string
          nullable: true
          maxLength: 1000
        tipo:
          type: string
          enum:
            - PERCENTUAL
            - VALOR_FIXO
        valor:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: NUMERIC(12,2); para PERCENTUAL deve ser menor ou igual a 100.
        dataInicio:
          type: string
          format: date-time
          nullable: true
        dataFim:
          type: string
          format: date-time
          nullable: true
        ativo:
          type: boolean
          description: Envie true para ativar ou false para inativar.
        quantidadeMinimaItens:
          type: integer
          format: int32
          minimum: 1
          description: Quantidade mínima de itens no pedido para elegibilidade do desconto.
    DescontoCadastro:
      type: object
      required:
        - titulo
        - tipo
        - valor
      properties:
        titulo:
          type: string
          minLength: 1
          maxLength: 150
        descricao:
          type: string
          nullable: true
          maxLength: 1000
        tipo:
          type: string
          enum:
            - PERCENTUAL
            - VALOR_FIXO
        valor:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: NUMERIC(12,2); para PERCENTUAL deve ser menor ou igual a 100.
        dataInicio:
          type: string
          format: date-time
          nullable: true
        dataFim:
          type: string
          format: date-time
          nullable: true
          description: Não pode ser anterior a dataInicio quando ambas forem informadas.
        ativo:
          type: boolean
          default: true
        quantidadeMinimaItens:
          type: integer
          format: int32
          minimum: 1
          default: 1
          description: Quantidade mínima de itens no pedido para elegibilidade do desconto.
    Desconto:
      type: object
      required:
        - id
        - titulo
        - tipo
        - valor
        - ativo
        - quantidadeMinimaItens
      properties:
        id:
          type: integer
          format: int64
        titulo:
          type: string
          maxLength: 150
        descricao:
          type: string
          nullable: true
          maxLength: 1000
        tipo:
          type: string
          enum:
            - PERCENTUAL
            - VALOR_FIXO
        valor:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: Para PERCENTUAL, deve ser menor ou igual a 100; para VALOR_FIXO, deve ser maior que zero.
        dataInicio:
          type: string
          format: date-time
          nullable: true
        dataFim:
          type: string
          format: date-time
          nullable: true
        ativo:
          type: boolean
        quantidadeMinimaItens:
          type: integer
          format: int32
          minimum: 1
          description: Quantidade mínima de itens no pedido para elegibilidade do desconto.
