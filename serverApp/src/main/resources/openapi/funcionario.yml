paths:
  /:
    post:
      tags:
        - Funcionário
      summary: Criar funcionário
      description: Cria o funcionário e provisiona uma conta FUNCIONARIO. O email é obrigatório e o login será a parte anterior a @, em minúsculas. Requer um token JWT de ADMIN.
      operationId: criarFuncionario
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FuncionarioCreate'
      responses:
        '201':
          description: Funcionário cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Funcionario'
        '400':
          description: E-mail inválido ou login derivado já cadastrado
          content:
            application/json:
              schema:
                $ref: './status.yml#/components/schemas/Erro'
        '401':
          description: Token JWT ausente ou inválido
        '403':
          description: O usuário autenticado não possui perfil ADMIN
    get:
      tags:
        - Funcionário
      summary: Listar funcionários
      description: Lista todos os funcionários cadastrados. Requer um token JWT de ADMIN.
      operationId: listarFuncionarios
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Funcionários encontrados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Funcionario'
        '401':
          description: Token JWT ausente ou inválido
        '403':
          description: O usuário autenticado não possui perfil ADMIN
  /{id}:
    get:
      tags:
        - Funcionário
      summary: Buscar funcionário por ID
      description: Requer um token JWT de ADMIN.
      operationId: buscarFuncionarioPorId
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador numérico do funcionário
          schema:
            type: integer
            format: int64
            minimum: 1
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Funcionário encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Funcionario'
        '400':
          $ref: './status.yml#/components/responses/ErroRequisicao'
        '404':
          $ref: './status.yml#/components/responses/RecursoNaoEncontrado'
        '401':
          description: Token JWT ausente ou inválido
        '403':
          description: O usuário autenticado não possui perfil ADMIN
    put:
      tags:
        - Funcionário
      summary: Substituir funcionário (Apenas ADMIN)
      description: Substitui os dados do funcionário. Campos opcionais omitidos assumem seus valores padrão. Requer um token JWT de ADMIN.
      operationId: atualizarFuncionario
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador numérico do funcionário
          schema:
            type: integer
            format: int64
            minimum: 1
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Funcionario'
      responses:
        '200':
          description: Funcionário atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Funcionario'
        '400':
          $ref: './status.yml#/components/responses/ErroRequisicao'
        '401':
          description: Token JWT ausente ou inválido
        '403':
          description: O usuário autenticado não possui perfil ADMIN
        '404':
          $ref: './status.yml#/components/responses/RecursoNaoEncontrado'
    delete:
      tags:
        - Funcionário
      summary: Desativar funcionário (Apenas ADMIN)
      description: Realiza o soft delete (inativação) do funcionário. Requer um token JWT de ADMIN.
      operationId: desativarFuncionario
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador numérico do funcionário
          schema:
            type: integer
            format: int64
            minimum: 1
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Funcionário desativado com sucesso
        '401':
          description: Token JWT ausente ou inválido
        '403':
          description: O usuário autenticado não possui perfil ADMIN
        '404':
          $ref: './status.yml#/components/responses/RecursoNaoEncontrado'
components:
  schemas:
    Funcionario:
      type: object
      required:
        - nome
        - cpf
      properties:
        id:
          type: integer
          format: int64
          nullable: true
          description: Gerado pelo banco.
        nome:
          type: string
          maxLength: 150
        cpf:
          type: string
          pattern: '^[0-9]{11}$'
          description: CPF com exatamente 11 dígitos numéricos.
        telefone:
          type: string
          maxLength: 20
          nullable: true
        email:
          type: string
          maxLength: 150
          nullable: true
          format: email
        cargo:
          type: string
          maxLength: 100
          nullable: true
        ativo:
          type: boolean
          default: true
        dataDeNascimento:
          type: string
          format: date
          nullable: true
    FuncionarioCreate:
      allOf:
        - $ref: '#/components/schemas/Funcionario'
        - type: object
          required:
            - email
          properties:
            email:
              type: string
              maxLength: 150
              pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
              format: email