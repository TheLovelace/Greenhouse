openapi: 3.0.3
info:
  title: Greenhouse API
  version: 1.0.0
  description: API do backend Greenhouse.
servers:
  - url: /api
    description: Prefixo padrão da API
tags:
  - name: Categoria
    description: Operações de cadastro e consulta de categorias
  - name: Cliente
    description: Operações de cadastro, consulta e gerenciamento de status de clientes
  - name: Desconto
    description: Cadastro e consulta de descontos
  - name: Fornecedor
    description: Operações de cadastro e consulta de fornecedores
  - name: Forma de Pagamento
    description: Cadastro, consulta e gerenciamento de formas de pagamento
  - name: Estoque
    description: Operações de movimentação e consulta de estoque
  - name: Produto
    description: Operações de cadastro e consulta de produtos
  - name: Funcionário
    description: Cadastro, consulta e gerenciamento de funcionários
  - name: Status
    description: Verificação da disponibilidade da API e do banco de dados
  - name: Pedido
    description: Registro, consulta e gerenciamento de status de pedidos
  - name: Espécie
    description: Cadastro, consulta, atualização e status de espécies
  - name: Alerta
    description: Cadastro, consulta, atualização e status de regras de alerta
paths:
  /categoria:
    $ref: './openapi/categoria.yml#/paths/~1categoria'
  /categoria/{id}:
    $ref: './openapi/categoria.yml#/paths/~1categoria~1%7Bid%7D'
  /cliente:
    $ref: './openapi/cliente.yml#/paths/~1cliente'
  /cliente/{id}:
    $ref: './openapi/cliente.yml#/paths/~1cliente~1%7Bid%7D'
  /desconto:
    $ref: './openapi/desconto.yml#/paths/~1desconto'
  /desconto/{id}:
    $ref: './openapi/desconto.yml#/paths/~1desconto~1%7Bid%7D'
  /estoque:
    $ref: './openapi/estoque.yml#/paths/~1estoque'
  /estoque/{produtoId}:
    $ref: './openapi/estoque.yml#/paths/~1estoque~1%7BprodutoId%7D'
  /fornecedor:
    $ref: './openapi/fornecedor.yml#/paths/~1fornecedor'
  /fornecedor/{id}:
    $ref: './openapi/fornecedor.yml#/paths/~1fornecedor~1%7Bid%7D'
  /forma-pagamento:
    $ref: './openapi/forma-pagamento.yml#/paths/~1forma-pagamento'
  /forma-pagamento/{id}:
    $ref: './openapi/forma-pagamento.yml#/paths/~1forma-pagamento~1%7Bid%7D'
  /pedido:
    $ref: './openapi/pedido.yml#/paths/~1pedido'
  /pedido/{id}:
    $ref: './openapi/pedido.yml#/paths/~1pedido~1%7Bid%7D'
  /pedido/{id}/status:
    $ref: './openapi/pedido.yml#/paths/~1pedido~1%7Bid%7D~1status'
  /produto:
    $ref: './openapi/produto.yml#/paths/~1produto'
  /produto/{id}:
    $ref: './openapi/produto.yml#/paths/~1produto~1%7Bid%7D'
  /status:
    $ref: './openapi/status.yml#/paths/~1status'
  /funcionario:
    $ref: './openapi/funcionario.yml#/paths/~1'
  /funcionario/{id}:
    $ref: './openapi/funcionario.yml#/paths/~1%7Bid%7D'

  /especies:
    $ref: './openapi/especie.yml#/paths/~1especies'
  /especies/{id}:
    $ref: './openapi/especie.yml#/paths/~1especies~1%7Bid%7D'
  /especies/{id}/status:
    $ref: './openapi/especie.yml#/paths/~1especies~1%7Bid%7D~1status'

  /alertas:
    $ref: './openapi/alerta.yml#/paths/~1alertas'
  /alertas/dispositivos:
    $ref: './openapi/alerta.yml#/paths/~1alertas~1dispositivos'
  /alertas/{id}:
    $ref: './openapi/alerta.yml#/paths/~1alertas~1%7Bid%7D'
  /alertas/{id}/status:
    $ref: './openapi/alerta.yml#/paths/~1alertas~1%7Bid%7D~1status'

  /auth/signin:
    $ref: 'openapi/auth.yml#/paths/~1auth~1signin'
  /auth/signup:
    $ref: 'openapi/auth.yml#/paths/~1auth~1signup'
components:
  schemas:
    Categoria:
      $ref: './openapi/categoria.yml#/components/schemas/CategoriaResponse'
    CategoriaCreateRequest:
      $ref: './openapi/categoria.yml#/components/schemas/CategoriaCreateRequest'
    CategoriaUpdateRequest:
      $ref: './openapi/categoria.yml#/components/schemas/CategoriaUpdateRequest'
    Cliente:
      $ref: './openapi/cliente.yml#/components/schemas/ClienteResponse'
    Desconto:
      $ref: './openapi/desconto.yml#/components/schemas/Desconto'
    Fornecedor:
      $ref: './openapi/fornecedor.yml#/components/schemas/Fornecedor'
    FormaPagamentoRequest:
      $ref: './openapi/forma-pagamento.yml#/components/schemas/FormaPagamentoRequest'
    FormaPagamentoResponse:
      $ref: './openapi/forma-pagamento.yml#/components/schemas/FormaPagamentoResponse'
    EstoqueCreate:
      $ref: './openapi/estoque.yml#/components/schemas/EstoqueCreate'
    Estoque:
      $ref: './openapi/estoque.yml#/components/schemas/Estoque'
    Funcionario:
      $ref: './openapi/funcionario.yml#/components/schemas/FuncionarioResponse'
    FuncionarioRequest:
      $ref: './openapi/funcionario.yml#/components/schemas/FuncionarioRequest'
    FuncionarioCreate:
      $ref: './openapi/funcionario.yml#/components/schemas/FuncionarioCreate'
    Produto:
      $ref: './openapi/produto.yml#/components/schemas/ProdutoResponse'
    ProdutoCreateRequest:
      $ref: './openapi/produto.yml#/components/schemas/ProdutoCreateRequest'
    ProdutoUpdateRequest:
      $ref: './openapi/produto.yml#/components/schemas/ProdutoUpdateRequest'
    Pedido:
      $ref: './openapi/pedido.yml#/components/schemas/PedidoResponse'
    PedidoCreateRequest:
      $ref: './openapi/pedido.yml#/components/schemas/PedidoCreateRequest'
    PedidoUpdateRequest:
      $ref: './openapi/pedido.yml#/components/schemas/PedidoUpdateRequest'
    AtualizarStatusPedidoRequest:
      $ref: './openapi/pedido.yml#/components/schemas/AtualizarStatusPedidoRequest'
    Status:
      $ref: './openapi/status.yml#/components/schemas/Status'
    Erro:
      $ref: './openapi/status.yml#/components/schemas/Erro'
    EspecieRequest:
      $ref: './openapi/especie.yml#/components/schemas/EspecieRequest'
    EspecieResponse:
      $ref: './openapi/especie.yml#/components/schemas/EspecieResponse'
    AlertaRequest:
      $ref: './openapi/alerta.yml#/components/schemas/AlertaRequest'
    AlertaResponse:
      $ref: './openapi/alerta.yml#/components/schemas/AlertaResponse'
    DispositivoIotResponse:
      $ref: './openapi/alerta.yml#/components/schemas/DispositivoIotResponse'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT