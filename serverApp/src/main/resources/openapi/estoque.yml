paths:
  /estoque/movimentacoes:
    get:
      tags:
        - Estoque
      summary: Consultar histórico de movimentações
      description: Lista as movimentações registradas com produto, tipo, quantidade, data e origem quando disponível. Resultados ordenados da mais recente para a mais antiga; em caso de empate, pelo identificador decrescente.
      operationId: listarMovimentacoesEstoque
      responses:
        '200':
          description: Histórico de movimentações; retorna uma lista vazia quando não há registros.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MovimentacaoEstoque'
    post:
      tags:
        - Estoque
      summary: Registrar ajuste ou perda de estoque
      description: Registra somente movimentações manuais AJUSTE_ENTRADA, AJUSTE_SAIDA ou PERDA. Entradas de compra e saídas de pedido devem ser registradas pelos respectivos fluxos após a confirmação dos status de negócio. Observação é opcional. Saídas não podem reduzir o estoque físico abaixo do reservado.
      operationId: registrarMovimentacaoEstoque
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarMovimentacaoEstoque'
      responses:
        '201':
          description: Movimentação registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovimentacaoEstoque'
        '400':
          $ref: './status.yml#/components/responses/ErroRequisicao'
        '404':
          $ref: './status.yml#/components/responses/RecursoNaoEncontrado'
  /estoque/{produtoId}:
    parameters:
      - name: produtoId
        in: path
        required: true
        description: Identificador numérico do produto
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags:
        - Estoque
      summary: Consultar posição de estoque por produto
      description: Retorna o saldo atual do estoque. A quantidade disponível é calculada como quantidade física menos quantidade reservada. A quantidade mínima é um limite separado. Produtos sem registro de estoque retornam quantidades zeradas; o histórico de movimentações não é somado novamente.
      operationId: buscarPosicaoEstoque
      responses:
        '200':
          description: Posição atual do estoque
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstoquePosicao'
        '400':
          $ref: './status.yml#/components/responses/ErroRequisicao'
        '404':
          $ref: './status.yml#/components/responses/RecursoNaoEncontrado'
components:
  schemas:
    RegistrarMovimentacaoEstoque:
      type: object
      additionalProperties: false
      required:
        - produtoId
        - tipo
        - quantidade
      properties:
        produtoId:
          type: integer
          format: int64
          minimum: 1
        tipo:
          type: string
          enum:
            - AJUSTE_ENTRADA
            - AJUSTE_SAIDA
            - PERDA
        quantidade:
          type: integer
          format: int32
          minimum: 1
        observacao:
          type: string
          nullable: true
          maxLength: 10000
    MovimentacaoEstoque:
      type: object
      required:
        - produtoId
        - tipo
        - quantidade
      properties:
        id:
          type: integer
          format: int64
        produtoId:
          type: integer
          format: int64
        pedidoId:
          type: integer
          format: int64
          nullable: true
        compraId:
          type: integer
          format: int64
          nullable: true
        funcionarioId:
          type: integer
          format: int64
          nullable: true
        tipo:
          type: string
          enum:
            - ENTRADA
            - SAIDA
            - AJUSTE_ENTRADA
            - AJUSTE_SAIDA
            - PERDA
        quantidade:
          type: integer
          format: int32
        observacao:
          type: string
          nullable: true
        dataHora:
          type: string
          format: date-time
    EstoquePosicao:
      type: object
      required:
        - produtoId
        - quantidadeFisica
        - quantidadeReservada
        - quantidadeDisponivel
        - quantidadeMinima
      properties:
        produtoId:
          type: integer
          format: int64
        quantidadeFisica:
          type: integer
          format: int32
          minimum: 0
        quantidadeReservada:
          type: integer
          format: int32
          minimum: 0
        quantidadeDisponivel:
          type: integer
          format: int32
          minimum: 0
          description: Quantidade física menos quantidade reservada.
        quantidadeMinima:
          type: integer
          format: int32
          minimum: 0
          description: Limite mínimo cadastrado para o produto, separado da quantidade disponível.
