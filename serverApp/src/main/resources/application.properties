spring.profiles.default=dev

logging.pattern.correlation=[%-8X{requestId}]\u0020
logging.include-application-name=false

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
springdoc.swagger-ui.url=/api/openapi.yaml
springdoc.swagger-ui.disable-swagger-default-url=true

spring.datasource.url=${DATABASE_URL}
jwt.secret=${JWT_SECRET}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true

relatorio.jacoco.dir=${JACOCO_REPORT_DIR:file:../build/reports/jacoco/coverage/html/}

mqtt.broker-url=${MQTT_BROKER_URL:}
mqtt.client-id=${MQTT_CLIENT_ID:greenhouse-server}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}
mqtt.qos=${MQTT_QOS:1}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
alerta.email.remetente=${ALERTA_EMAIL_REMETENTE:}
alerta.email.destino=${ALERTA_EMAIL_DESTINO:}
